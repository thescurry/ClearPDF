name: macOS app

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  macos-app:
    name: osx-x64 unsigned app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Core
        run: dotnet test tests/ClearPDF.Tests/ClearPDF.Tests.csproj -c Release --nologo

      - name: Publish, bundle, and zip unsigned ClearPDF.app
        run: |
          chmod +x packaging/macos/*.sh
          ./packaging/macos/build-unsigned-app.sh

      - name: Upload unsigned .app zip
        uses: actions/upload-artifact@v4
        with:
          name: ClearPDF-macos-x64-app
          path: dist/macos/ClearPDF-macos-x64.zip
          if-no-files-found: error
