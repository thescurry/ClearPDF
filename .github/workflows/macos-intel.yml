name: macOS Intel

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

# Standard GitHub-hosted runner only (macos-13 = Intel x86_64).
# No self-hosted, no larger/metal images.
jobs:
  macos-intel:
    name: osx-x64 DMG
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Core
        run: dotnet test tests/ClearPDF.Tests/ClearPDF.Tests.csproj -c Release --nologo

      - name: Publish osx-x64 self-contained
        run: >
          dotnet publish src/ClearPDF.Desktop/ClearPDF.Desktop.csproj
          -c Release
          -r osx-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -o publish/osx-x64

      - name: Bundle ClearPDF.app
        run: ./packaging/macos/bundle-app.sh publish/osx-x64 dist/macos

      - name: Sign and notarize (skipped without secrets)
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: ./packaging/macos/sign-and-notarize.sh dist/macos/ClearPDF.app

      - name: Create DMG
        run: ./packaging/macos/create-dmg.sh dist/macos/ClearPDF.app dist/macos/ClearPDF-macos-x64.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPDF-macos-x64
          path: dist/macos/ClearPDF-macos-x64.dmg
          if-no-files-found: error
